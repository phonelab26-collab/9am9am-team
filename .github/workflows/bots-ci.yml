name: bots-ci

on:
  push:
    paths:
      - "bots/9am9am-bots/**"
      - ".github/workflows/bots-ci.yml"
  pull_request:
    paths:
      - "bots/9am9am-bots/**"
      - ".github/workflows/bots-ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bots/9am9am-bots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bots/9am9am-bots/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Runtime smoke test (no provider calls)
        run: npm run smoke
